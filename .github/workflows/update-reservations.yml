name: 予約情報の更新



on:

  workflow_dispatch:
  
    inputs:
    
      dry_run:
      
        description: "カレンダーへ書き込まず取得結果だけ確認する"
        
        required: true
        
        default: true
        
        type: boolean
        


permissions:

  contents: read
  


jobs:

  update-reservations:
  
    runs-on: ubuntu-latest
    
    timeout-minutes: 10
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        


      - name: Setup Python
      
        uses: actions/setup-python@v5
        
        with:
        
          python-version: "3.12"
          


      - name: Install dependencies
      
        run: pip install -r requirements.txt && playwright install --with-deps chromium
        


      - name: Fetch reservations
      
        env:
        
          RESERVATION_USER_ID: ${{ secrets.RESERVATION_USER_ID }}
          
          RESERVATION_PASSWORD: ${{ secrets.RESERVATION_PASSWORD }}
          
          DRY_RUN: ${{ inputs.dry_run }}
          
        run: python -m src.fetch_reservations
        


























